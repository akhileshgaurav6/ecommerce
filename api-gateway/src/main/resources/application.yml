spring:
  application:
    name: api-gateway

  #api gateway confi
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**
          filters:
            -StripPrefix=2
            -RedirectTo=302, https://codingshuttle.com
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            -StripPrefix=2
            -AddRequestHeader=X-Custom-Header, Akhilesh
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
